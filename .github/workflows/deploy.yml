name: Deploy Quarto Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Botón de encendido manual: pestaña Actions -> "Deploy Quarto Site"
  # -> botón "Run workflow". Publica el sitio cuando tú lo decidas, sin
  # tener que cambiar ningún archivo.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validar:
    name: Validar lecciones
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validar encabezados y nombres de las lecciones
        run: python3 scripts/validar-lecciones.py

  build-deploy:
    name: Construir y publicar
    needs: validar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # R hace falta para las lecciones con bloques ```{r} (los que se
      # ejecutan). Si tu curso no usa R, puedes borrar estos dos pasos.
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar paquetes de R
        shell: Rscript {0}
        run: |
          install.packages(c(
            "knitr",
            "rmarkdown"
            # Agrega aquí los paquetes que uses en tus lecciones, por ejemplo:
            # , "ggplot2"
            # , "dplyr"
          ))

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
